name: Build Android APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Generate Android project
        env:
          CI: '1'
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Collect release files
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/YouTube-Transcript-Studio-v1.2.0-arm64.apk
          cp pnpm-lock.yaml dist-apk/pnpm-lock.yaml
          sha256sum dist-apk/YouTube-Transcript-Studio-v1.2.0-arm64.apk | tee dist-apk/SHA256SUMS.txt
          unzip -t dist-apk/YouTube-Transcript-Studio-v1.2.0-arm64.apk
          ls -lh dist-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-transcript-studio-v1.2.0-arm64
          path: |
            dist-apk/YouTube-Transcript-Studio-v1.2.0-arm64.apk
            dist-apk/SHA256SUMS.txt
            dist-apk/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
